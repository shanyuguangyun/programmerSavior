server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        # Session Cookie 不暴露给 JavaScript，降低 XSS 窃取风险
        http-only: true
        # 本地开发前后端通过 Vite 代理同源访问；如拆成两个域名，需要改成 none + secure
        same-site: lax
        secure: false

spring:
  application:
    name: programmer-savior-backend

  datasource:
    # app_user 当前只有 mock_prod_db 的权限；
    # 如果以后切到独立数据库，只需修改 DB_URL / DB_USERNAME / DB_PASSWORD 环境变量。
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/mock_prod_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_general_ci}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:app_password_123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  jackson:
    time-zone: Asia/Shanghai

  servlet:
    multipart:
      # HTML 文件本身限制 2MB，这里再留一点表单字段的余量
      max-file-size: 2MB
      max-request-size: 3MB

mybatis-plus:
  configuration:
    # 数据库 snake_case 字段映射到 Java camelCase 属性
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  level:
    com.programmersavior.backend: INFO
